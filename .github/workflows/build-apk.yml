name: Build Farloh TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.FARLOH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > farloh-release.jks
            echo "FARLOH_KEYSTORE_FILE=farloh-release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          else
            echo "::warning::Secret FARLOH_KEYSTORE_BASE64 is not set - this APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          FARLOH_KEYSTORE_PASSWORD: ${{ secrets.FARLOH_KEYSTORE_PASSWORD }}
          FARLOH_KEY_ALIAS: farloh
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp "$APK" "dist/FarlohTV-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FarlohTV-apk
          path: dist/*.apk

      - name: Publish as a GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Farloh TV ${{ env.VERSION }} (build ${{ github.run_number }})
          body: Download FarlohTV-v${{ env.VERSION }}.apk below and install it on your TV box, Fire Stick or phone.
          files: dist/*.apk
