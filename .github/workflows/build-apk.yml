name: Build Farloh TV APK

on:
  push:
    # main = published versions (creates a GitHub release).
    # dev  = test builds only: compiled and checked, never released.
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.FARLOH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > farloh-release.jks
            echo "FARLOH_KEYSTORE_FILE=farloh-release.jks" >> "$GITHUB_ENV"
            echo "Release signing key found."
          else
            echo "::warning::Secret FARLOH_KEYSTORE_BASE64 is not set - this APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          FARLOH_KEYSTORE_PASSWORD: ${{ secrets.FARLOH_KEYSTORE_PASSWORD }}
          FARLOH_KEY_ALIAS: farloh
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler / Gradle errors as annotations so they show on the run summary.
          grep -E "^e: |error: |ERROR:|AAPT: error" build.log | head -60 > errs.txt || true
          if [ -s errs.txt ]; then
            echo "::error title=Compile::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errs.txt)"
          fi
          awk '/What went wrong/{f=1} f{print; n++} n>25{exit}' build.log > wrong.txt || true
          if [ -s wrong.txt ]; then
            echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' wrong.txt)"
          fi

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp "$APK" "dist/FarlohTV-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FarlohTV-apk
          path: dist/*.apk

      - name: Publish as a GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Farloh TV ${{ env.VERSION }} (build ${{ github.run_number }})
          body: Download FarlohTV-v${{ env.VERSION }}.apk below and install it on your TV box, Fire Stick or phone.
          files: dist/*.apk
